name: lint

on:
  push:
  pull_request:

jobs:
  shell-lint:
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm-slim

    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates \
            shellcheck shfmt devscripts

      - name: Checkout
        uses: actions/checkout@v4

      - name: shellcheck (OpenWrt-oriented)
        run: |
          # Ignore info/style (e.g. SC2015) by using severity=warning.
          shellcheck -S warning -s sh \
            install.sh update.sh uninstall.sh \
            files/lib/tg-ws-proxy-common.sh \
            files/usr/bin/tg-ws-proxyctl \
            files/usr/libexec/tg-ws-proxy/run.sh

          # OpenWrt init scripts intentionally set variables consumed by /etc/rc.common.
          # Suppress "unused variable" warnings for this file only.
          shellcheck -S warning -s sh -e SC2034 \
            files/etc/init.d/tg-ws-proxy.in

      - name: checkbashisms (gate with allowlist for BusyBox ash)
        run: |
          set -e

          # checkbashisms targets Debian /bin/sh (dash) portability checks.
          # Our runtime is BusyBox ash on OpenWrt, where:
          # - 'local' is supported
          # - 'echo -e' is intentionally used for colored output
          #
          # We still want to fail on NEW/UNEXPECTED bashisms, so we filter out
          # known/intentional patterns and fail if anything else remains.

          out="$(
            checkbashisms -f \
              install.sh update.sh uninstall.sh \
              files/lib/tg-ws-proxy-common.sh \
              files/etc/init.d/tg-ws-proxy.in \
              files/usr/bin/tg-ws-proxyctl \
              files/usr/libexec/tg-ws-proxy/run.sh 2>&1 || true
          )"

          if [ -n "$out" ]; then
            echo "$out"
          fi

          filtered="$(printf '%s\n' "$out" | grep -vE 'echo -e|unsafe echo with backslash|local' || true)"

          if [ -n "$filtered" ]; then
            echo ""
            echo "Disallowed bashisms detected (not in allowlist):"
            echo "$filtered"
            exit 1
          fi

      - name: shfmt (format check)
        run: |
          shfmt -d -i 2 -ci -bn \
            install.sh update.sh uninstall.sh \
            files/lib/tg-ws-proxy-common.sh \
            files/etc/init.d/tg-ws-proxy.in \
            files/usr/bin/tg-ws-proxyctl \
            files/usr/libexec/tg-ws-proxy/run.sh