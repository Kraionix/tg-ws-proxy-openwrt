name: lint

on:
  push:
  pull_request:

# Hardening: least privilege for GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  harden-actions:
    name: Harden Actions (enforce SHA pinning)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure SHA pinned actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@ca46236c6ce584ae24bc6283ba8dcf4b3ec8a066 # v5.0.4
        with:
          # Empty allowlist = deny all (fail on any unpinned third-party action).
          allowlist: ""
          dry_run: "false"

  shell-lint:
    name: Shell lint
    needs: harden-actions
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm-slim

    defaults:
      run:
        shell: sh

    steps:
      - name: Install linters
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates \
            shellcheck devscripts \
            curl tar gzip

          # Pin shfmt to the same major/minor as local pre-commit.
          SHFMT_VERSION="v3.13.0"

          arch="$(dpkg --print-architecture 2>/dev/null || echo amd64)"
          case "$arch" in
            amd64) shfmt_arch="amd64" ;;
            arm64) shfmt_arch="arm64" ;;
            *)
              echo "Unsupported architecture for shfmt: $arch" >&2
              exit 1
              ;;
          esac

          curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_${shfmt_arch}"
          chmod +x /usr/local/bin/shfmt
          shfmt --version

          # Install actionlint (pinned).
          ACTIONLINT_VERSION="1.7.12"

          case "$arch" in
            amd64) actionlint_arch="amd64" ;;
            arm64) actionlint_arch="arm64" ;;
            *)
              echo "Unsupported architecture for actionlint: $arch" >&2
              exit 1
              ;;
          esac

          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_${actionlint_arch}.tar.gz"
          tar -xzf "$tmp/actionlint.tar.gz" -C "$tmp"
          cp "$tmp/actionlint" /usr/local/bin/actionlint
          chmod +x /usr/local/bin/actionlint
          rm -rf "$tmp"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint (GitHub Actions workflow lint)
        run: |
          actionlint -color

      - name: CRLF check (must be LF in repo)
        run: |
          set -e

          CR="$(printf '\r')"

          files_with_crlf="$(
            grep -IUlr "$CR" \
              install.sh update.sh uninstall.sh \
              files/lib/tg-ws-proxy-common.sh \
              files/etc/init.d/tg-ws-proxy.in \
              files/usr/bin/tg-ws-proxyctl \
              files/usr/libexec/tg-ws-proxy/run.sh \
              README.md \
              .github/workflows/lint.yml \
              .shellcheckrc \
              .gitattributes \
              2>/dev/null || true
          )"

          if [ -n "$files_with_crlf" ]; then
            echo "CRLF line endings detected (expected LF only):"
            echo "$files_with_crlf"
            echo ""
            echo "Fix hint:"
            echo "  - Ensure .gitattributes enforces LF"
            echo "  - Run: git add --renormalize . && git commit"
            exit 1
          fi

      - name: shellcheck (OpenWrt-oriented)
        run: |
          shellcheck -S warning -s sh \
            install.sh update.sh uninstall.sh \
            files/lib/tg-ws-proxy-common.sh \
            files/usr/bin/tg-ws-proxyctl \
            files/usr/libexec/tg-ws-proxy/run.sh

          shellcheck -S warning -s sh -e SC2034 \
            files/etc/init.d/tg-ws-proxy.in

      - name: checkbashisms (gate with allowlist for BusyBox ash)
        run: |
          set -e

          out="$(
            checkbashisms -f \
              install.sh update.sh uninstall.sh \
              files/lib/tg-ws-proxy-common.sh \
              files/etc/init.d/tg-ws-proxy.in \
              files/usr/bin/tg-ws-proxyctl \
              files/usr/libexec/tg-ws-proxy/run.sh 2>&1 || true
          )"

          if [ -n "$out" ]; then
            echo "$out"
          fi

          filtered="$(printf '%s\n' "$out" | grep -vE \
            'echo -e|unsafe echo with backslash|local|does not appear to have a #! interpreter line' || true)"

          if [ -n "$filtered" ]; then
            echo ""
            echo "Disallowed bashisms detected (not in allowlist):"
            echo "$filtered"
            exit 1
          fi

      - name: shfmt (format gate; list-only)
        run: |
          set -e

          not_formatted="$(
            shfmt -l -i 2 -ci -bn -ln posix \
              install.sh update.sh uninstall.sh \
              files/lib/tg-ws-proxy-common.sh \
              files/etc/init.d/tg-ws-proxy.in \
              files/usr/bin/tg-ws-proxyctl \
              files/usr/libexec/tg-ws-proxy/run.sh || true
          )"

          if [ -n "$not_formatted" ]; then
            echo "shfmt would reformat the following files:"
            echo "$not_formatted"
            echo ""
            echo "Fix hint (run locally):"
            echo "  pre-commit run --all-files"
            exit 1
          fi
