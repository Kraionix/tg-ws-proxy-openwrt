name: lint

on:
  push:
  pull_request:

jobs:
  shell-lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt devscripts

      - name: shellcheck (OpenWrt-oriented sh)
        run: |
          shellcheck -s sh \
            install.sh update.sh uninstall.sh \
            files/lib/tg-ws-proxy-common.sh \
            files/etc/init.d/tg-ws-proxy.in \
            files/usr/bin/tg-ws-proxyctl \
            files/usr/libexec/tg-ws-proxy/run.sh

      - name: checkbashisms (gate with allowlist for BusyBox ash)
        run: |
          set -e

          # checkbashisms is designed for Debian /bin/sh (dash) portability checks.
          # Our runtime is BusyBox ash on OpenWrt, where 'local' is supported,
          # and we intentionally use 'echo -e' for colored output.
          #
          # We still want a "gate" that fails on NEW/UNEXPECTED bashisms.
          # So: run checkbashisms, then filter out known/intentional findings.

          out="$(
            checkbashisms -f \
              install.sh update.sh uninstall.sh \
              files/lib/tg-ws-proxy-common.sh \
              files/etc/init.d/tg-ws-proxy.in \
              files/usr/bin/tg-ws-proxyctl \
              files/usr/libexec/tg-ws-proxy/run.sh 2>&1 || true
          )"

          if [ -n "$out" ]; then
            echo "$out"
          fi

          # Allowlist patterns (intentional for OpenWrt BusyBox ash):
          # - echo -e (and related "unsafe echo with backslash" warnings)
          # - local (ash extension)
          filtered="$(printf '%s\n' "$out" | grep -vE 'echo -e|unsafe echo with backslash|local' || true)"

          if [ -n "$filtered" ]; then
            echo ""
            echo "Disallowed bashisms detected (not in allowlist):"
            echo "$filtered"
            exit 1
          fi

      - name: shfmt (format check)
        run: |
          shfmt -d -i 2 -ci -bn \
            install.sh update.sh uninstall.sh \
            files/lib/tg-ws-proxy-common.sh \
            files/etc/init.d/tg-ws-proxy.in \
            files/usr/bin/tg-ws-proxyctl \
            files/usr/libexec/tg-ws-proxy/run.sh